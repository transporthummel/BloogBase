[package]
name = "bloogbase"
version = "0.1.0"
description = "A cross-platform desktop launcher for the Commander Keen games"
authors = ["transporthummel"]
license = "MIT"
repository = "https://github.com/transporthummel/BloogBase"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bloogbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
zip = { version = "9.0.3", features = ["legacy-zip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = { version = "0.1.44", features = ["log-always"] }
walkdir = "2.5.0"
scraper = "0.27.0"
minisign-verify = "0.3.0"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
tar = "0.4.46"
lzma-rs = "0.3.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
minisign = "0.10.0"
tempfile = "3.27.0"
