# BloogBase defaults for Commander Keen 1-3 (Vorticons engine). To tune (PLAN.md §6.3).
# Shipped with the app and rewritten on every launch: put your own settings
# into the global or per-game override instead.

[sdl]
fullscreen = off

[render]
aspect = on

[cpu]
core = normal
# The Vorticons games are speed sensitive; keep the CPU slow.
cpu_cycles = 4000
