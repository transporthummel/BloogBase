# BloogBase defaults for Commander Keen 1-3 (Vorticons engine).
# Shipped with the app and rewritten on every launch: put your own settings
# into the global or per-game override instead.

[sdl]
# Exclusive fullscreen breaks the picture when Alt+Enter switches to it while
# a game runs.
fullscreen_mode = forced-borderless

[render]
aspect = on

[cpu]
core = normal
# The Vorticons games are speed sensitive; keep the CPU slow.
cpu_cycles = 4000
