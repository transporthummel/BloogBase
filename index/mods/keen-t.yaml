released: 2010-11-17
added: 2026-11-21
type: episode
description: "Keen breaks up a Shikadi alliance, teleporting from an asteroid to two moons and a planet. There is no oxygen, so every level runs against the clock; each set of levels builds on its first with new hazards."
translations:
  de:
    description: "Keen sprengt eine Shikadi-Allianz und teleportiert sich von einem Asteroiden zu zwei Monden und einem Planeten. Dort gibt es keinen Sauerstoff, also läuft jedes Level gegen die Uhr; jeder Levelsatz baut mit neuen Gefahren auf seinem ersten auf."
