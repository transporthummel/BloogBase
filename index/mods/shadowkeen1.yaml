id: shadowkeen1
name: "Shadow Keen 1: A Shadow Over Dune"
game: keen1
requires: [keen1-1.1, keen1-1.31]
authors: ["Levellord", "Captainkeen"]
authorLinks:
  "Levellord": https://keenwiki.shikadi.net/wiki/Levellord
released: 2004-02-06
updated: 2012-09-07
added: 2026-10-30
type: episode
description: "Keen studies the magic planet Dune and runs into an old enemy. Two halves with their own graphics and levels, made from Apogee classics; the first part of the Shadow Keen trilogy. Captainkeen's remake from 2012 covers only the first half."
translations:
  de:
    description: "Keen erforscht den magischen Planeten Dune und trifft auf einen alten Feind. Zwei Hälften mit eigenen Grafiken und Leveln, zusammengesetzt aus Apogee-Klassikern; der erste Teil der Shadow-Keen-Trilogie. Captainkeens Remake von 2012 umfasst nur die erste Hälfte."
