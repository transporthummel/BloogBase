    description: "Demos einer unfertigen Keen-4-Mod, die direkt nach dem Originalspiel spielt, mit umgefärbten Kreaturen, einer Maschinengewehr-Strahlenpistole und verschlungenen Leveln voller Türen. Drei Demos mit je vier Leveln."
