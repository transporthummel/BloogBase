description: "Keen Dreams Gold Edition significantly expands the original game with 46 levels, new enemies, bosses, difficulty settings, gameplay mechanics like the pogo stick, and additional music and graphics. The newly updated version uses a completely new control panel interface, involving many features as well from Keen 4-6."
translations:
