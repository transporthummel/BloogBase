    description: "Die Keen Dreams Gold Edition erweitert das Originalspiel erheblich und bietet 46 Level, neue Gegner und Bosse, zusätzliche Schwierigkeitsgrade, neue Gameplay-Mechaniken wie den Pogo-Stick sowie zusätzliche Musik und Grafiken. Die neu aktualisierte Version verfügt über eine komplett neue Einstellungsoberfläche, die zudem zahlreiche Funktionen aus Keen 4–6 integriert."
