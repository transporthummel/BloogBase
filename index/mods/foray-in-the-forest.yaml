# A source mod: FITF.EXE is its own menu, which starts FITF-C.EXE (classic
# Keen) or FITF-X.EXE (Xky's Keen), and the game data is all in its own
# *.CKS files. It needs nothing from Keen 4 and plays on any copy; PLAY.BAT
# only adds `cycles max` and the `adlib` argument.
recipe:
  type: program
  program: FITF.EXE
  args: [adlib]
# The menu has no title screen; both builds show the same one.
cover: FITF-X.EXE
