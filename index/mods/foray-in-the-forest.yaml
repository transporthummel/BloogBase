description: "Back home as Billy Blaze, Keen finds his plush hero friends kidnapped and follows a cryptic note to a colourful forest planet. A source mod built over 14 years, with new graphics, music and enemies; the choice between classic Keen and Xky's Keen graphics is made in its menu."
translations:
  de:
    description: "Wieder zu Hause als Billy Blaze, findet Keen seine Plüsch-Heldenfreunde entführt und folgt einer rätselhaften Nachricht auf einen bunten Waldplaneten. Eine Source-Mod aus 14 Jahren Arbeit mit neuen Grafiken, neuer Musik und neuen Gegnern; im Menü wählt man zwischen klassischer Keen-Grafik und der von Xky."
