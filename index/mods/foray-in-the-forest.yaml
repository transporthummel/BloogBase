# A source mod: FITF.EXE is its own menu, which starts FITF-C.EXE (classic
# Keen) or FITF-X.EXE (Xky's Keen), and the game data is all in its own
# *.CKS files. It needs nothing from Keen 4, so it's standalone (apps before
# 1.2.0 play it on any Keen 4 copy); PLAY.BAT only adds `cycles max` and the
# `adlib` argument.
standalone: true
recipe:
  type: program
  program: FITF.EXE
  args: [adlib]
# The menu has no title screen; both builds show the same one.
cover: FITF-X.EXE
featured: true
# Older apps find no mod in it (no Keen files) and show Keen 4's cover.
minAppVersion: 1.1.0
