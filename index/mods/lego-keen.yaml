id: lego-keen
name: Lego Keen
game: keen1
authors: [Ilsoap]
version: "1.1"
released: 2003-12-12
updated: 2003-12-18
added: 2026-10-25
type: episode
description: "Billy builds a LEGO kingdom for Christmas, and his Captain Keen has to gather four gems to rescue its princess from Sir Icky's castle. The levels are built entirely from LEGO bricks, and Keen and the monsters look like LEGO figures."
translations:
  de:
    description: "Billy baut zu Weihnachten ein Lego-Königreich, und sein Captain Keen muss vier Edelsteine sammeln, um die Prinzessin aus Sir Ickys Burg zu retten. Die Level sind ganz aus Legosteinen gebaut, und Keen und die Monster sehen aus wie LEGO-Figuren."
