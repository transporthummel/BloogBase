# lego.bat runs `ck1patch lego.pat`. The mod brings its own unpacked
# KEEN1.EXE, so it plays on any copy of Keen 1.
# Brings an executable and all of the game's files: plays without a copy of it.
standalone: true
recipe:
  type: patch
  patcher: CK1PATCH.EXE
  patch: lego.pat
# Lego Levels' patch loads Lego Keen's tiles.
provides: [lego.tli]
