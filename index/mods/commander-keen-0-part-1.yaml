type: episode
description: 'Sixteen levels in a row on a bare map, with blocky enemies and crosses strewn through the graphics; the story is "Keen goes to a place". Keen 0 Plus from 2023 tidies it up and starts Keen with the pogo stick.'
translations:
  de:
    description: "Sechzehn Level hintereinander auf einer kargen Karte, mit klotzigen Gegnern und Kreuzen überall in der Grafik; die Story lautet „Keen geht an einen Ort“. Keen 0 Plus von 2023 räumt sie auf und lässt Keen mit dem Pogo-Stick starten."
