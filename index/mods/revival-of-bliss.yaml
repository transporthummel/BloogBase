# Brings an executable and all of the game's files: plays without a copy of it.
standalone: true
# play.bat runs the launcher's menu (MKLAUNCH.EXE): Keen, Craig and the
# password-locked epilogue, each a whole game in its own folder (decided
# 2026-11-19, PLAN.md §9.7).
root: ""
recipe:
  type: batch
  file: play.bat
saveDirs:
  - dir: KEEN
    name: Keen
  - dir: CRAIG
    name: Craig
    # Installs from before played CRAIG/ alone.
    oldRoot: true
  - dir: FUTURE
    name: Epilogue
    translations: { de: { name: Epilog } }
coverFrom: { dir: CRAIG, patch: abiathar.pat }
# Older apps would look for play.bat in CRAIG/.
minAppVersion: 1.4.0
