description: "After learning that the Bloogs are responsible for the kidnapping of his pet Yorp Spot, Commander Keen sets course for Fribbulus Xax. However, the planet is protected by the Shikadi's space station: The Omegamatrix! Keen must disable the station in order to reach the planet."
translations:
  de:
    description: "Nachdem er herausgefunden hat, dass die Bloogs für die Entführung seines Haustiers Yorp Spot verantwortlich sind, nimmt Commander Keen Kurs auf Fribbulus Xax. Der Planet wird jedoch von der Raumstation der Shikadi beschützt: der Omegamatrix! Um den Planeten erreichen zu können, muss Keen die Station außer Gefecht setzen."
