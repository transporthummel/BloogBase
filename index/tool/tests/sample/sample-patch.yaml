id: sample-patch
name: Sample Patch Mod
game: keen4
requires: [keen4-1.4-ega]
authors: [Someone, Someone Else]
version: "1.2"
released: 2023-08-23
updated: 2024-01-02
added: 2026-10-01
type: episode
description: A made-up mod for tests.
translations:
  de:
    description: Eine ausgedachte Mod für Tests.
links:
  keenwiki: https://keenwiki.shikadi.net/wiki/Sample
  pckf: https://pckf.com/viewtopic.php?t=1
  keenmodding: https://keenmodding.org/viewtopic.php?t=2
downloads:
  - version: "1.2"
    url: https://example.com/sample-1.2.zip
    sha256: 1111111111111111111111111111111111111111111111111111111111111111
    size: 1234
recipe:
  type: patch
  patcher: CK4PATCH.EXE
  patch: SAMPLE.PAT
tags: [new-graphics]
featured: true
worlds:
  new: { type: batch, file: GEN.BAT }
  play: { type: patch, patcher: CK4PATCH.EXE, patch: WORLD.PAT }
  files: [WORLD*.CK4, WORLD.PAT]
  seed:
    arg: /SEED
    max: 65535
    read: { file: WORLD.PAT, after: "Seed: " }
  options:
    - id: hard
      arg: /HARD
      type: flag
      label: { en: "Hard", de: "Schwer" }
    - id: lives
      arg: /LIVES
      type: number
      min: 1
      max: 9
      default: 3
      label: { en: "Lives", de: "Leben" }
