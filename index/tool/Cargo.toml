[package]
name = "bloogbase-index"
version = "0.1.0"
description = "Checks, builds and signs the BloogBase mod index"
license = "MIT"
edition = "2024"
publish = false

[[bin]]
name = "bbindex"
path = "src/main.rs"

[dependencies]
minisign = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate", "legacy-zip"] }

[dev-dependencies]
tempfile = "3.27.0"
