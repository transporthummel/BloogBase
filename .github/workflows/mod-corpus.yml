name: Mod corpus

# Checks mod detection against real mods (src-tauri/tests/mod-corpus.json).
# Weekly rather than on every push: the archives come from the community's
# file server, so they are cached and only fetched when the list changes.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/tests/mod-corpus.json

env:
  CARGO_TERM_COLOR: always
  BLOOGBASE_MOD_CACHE: ${{ github.workspace }}/mod-cache

jobs:
  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mod-cache
          key: mod-corpus-${{ hashFiles('src-tauri/tests/mod-corpus.json') }}
          restore-keys: mod-corpus-

      - name: Corpus test
        working-directory: src-tauri
        run: cargo test --lib corpus -- --ignored --nocapture
