name: Release

# Started by hand on main (Actions → Release → Run workflow, see
# docs/releasing.md): writes the version into the project, moves the
# changelogs' unreleased entries under it, commits that to main as "Prepare
# version …" with a tag, then builds installers for every OS (not code-signed)
# and drafts a GitHub release with them, the updater manifest (latest.json) and
# the version's CHANGELOG.md section and the download hints
# (.github/release-downloads.md, with links to this version's files) as its
# description.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0
        required: true
        type: string
      commit:
        description: Commit main must be at (optional; stops if main has moved on)
        required: false
        type: string

concurrency:
  group: release

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare version ${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.prepare.outputs.notes }}
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check the workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start the release from main, not ${GITHUB_REF_NAME}."
          exit 1

      # All history, for the tags of earlier releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check main is at the given commit
        if: inputs.commit != ''
        run: |
          if ! wanted=$(git rev-parse --verify --quiet "${COMMIT}^{commit}"); then
            echo "::error::${COMMIT} isn't a commit on GitHub."
            exit 1
          fi
          if [ "$wanted" != "$(git rev-parse HEAD)" ]; then
            echo "::error::main is at $(git rev-parse --short HEAD), not ${COMMIT}."
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Write the version and move the changelogs
        id: prepare
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          node scripts/release.mjs "$VERSION" "$(date -u +%F)" "$RUNNER_TEMP/notes.md" "${last#v}"
          pnpm exec prettier --write CHANGELOG.md package.json src/updates/changelog.json
          # The release's description: its changes, then which file to download.
          # Unwrapped, as GitHub shows every line break of a release's text.
          {
            cat "$RUNNER_TEMP/notes.md"
            printf '\n---\n\n'
            sed "s/@VERSION@/${VERSION}/g" .github/release-downloads.md
          } | pnpm exec prettier --stdin-filepath notes.md --prose-wrap never > "$RUNNER_TEMP/body.md"
          {
            echo "notes<<END_OF_NOTES"
            cat "$RUNNER_TEMP/body.md"
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Atomic, so neither lands if main has moved on meanwhile.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Prepare version ${VERSION}"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          # The oldest supported Ubuntu, so the AppImage runs on older glibc.
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # The tag, so re-running a failed build builds the same commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v${{ inputs.version }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Collect third-party licenses
        run: pnpm licenses:generate

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (required).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The DMG's window layout and background need Finder, which Tauri
          # skips on CI. GitHub's macOS runners have a desktop session
          # (tauri-apps/tauri#1731).
          TAURI_BUNDLER_DMG_IGNORE_CI: true
        with:
          tagName: v${{ inputs.version }}
          releaseName: BloogBase __VERSION__
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Updater artifacts only here: local builds have no signing key.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
