name: Release

# Builds installers for every OS (not code-signed, see docs/releasing.md) and drafts a GitHub release with
# them and the updater manifest (latest.json). Push a tag like v1.0.0;
# see docs/releasing.md for the secrets this needs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          # The oldest supported Ubuntu, so the AppImage runs on older glibc.
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Collect third-party licenses
        run: pnpm licenses:generate

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (required).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BloogBase __VERSION__
          releaseBody: |
            Download the file for your system below:

            - **Windows:** `BloogBase_…_x64-setup.exe`. Windows may say it protected your PC because the installer isn't signed: click *More info* → *Run anyway*.
            - **macOS:** `BloogBase_…_aarch64.dmg` (Apple Silicon) or `…_x64.dmg` (Intel). Drag BloogBase into Applications. The first start is blocked because the app isn't notarized: open *System Settings → Privacy & Security* and click *Open Anyway*.
            - **Linux:** the `.AppImage` (make it executable and start it) or the `.deb` for Debian/Ubuntu.

            BloogBase updates itself after that.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Updater artifacts only here: local builds have no signing key.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
