name: Audit

# Known vulnerabilities in the dependencies that ship: both Rust lockfiles
# (cargo audit, RustSec) and the frontend's production packages (pnpm audit).
# Weekly, as new advisories come out without any change here, and when a
# lockfile changes. Warnings (unmaintained or unsound crates) don't fail it.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - index/tool/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - src-tauri/Cargo.lock
      - index/tool/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit
      - name: App
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Index tool
        if: ${{ !cancelled() }}
        run: cargo audit --file index/tool/Cargo.lock

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only what ships in the app; build tools like ESLint don't.
      - name: Production packages
        run: pnpm audit --prod
