name: Audit

# Known vulnerabilities in the dependencies that ship: both Rust lockfiles
# (cargo audit, RustSec) and the frontend's production packages (pnpm audit).
# Weekly, as new advisories come out without any change here, and when a
# lockfile changes. Warnings (unmaintained or unsound crates) don't fail it.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - index/tool/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - src-tauri/Cargo.lock
      - index/tool/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit
      - name: App
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Index tool
        if: ${{ !cancelled() }}
        run: cargo audit --file index/tool/Cargo.lock

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Only what ships in the app; build tools like ESLint don't.
      - name: Production packages
        run: pnpm audit --prod
