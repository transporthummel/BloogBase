name: macOS screenshots

# Started by hand (Actions → macOS screenshots → Run workflow). Builds the app
# for Apple Silicon, ad-hoc signed like a release, and lets
# scripts/macos-screenshots.sh take real screenshots of macOS blocking its first
# start and of "Open Anyway" in System Settings, in English and German, for the
# README (docs/screenshots.md). The pictures come back as the "macos-screenshots"
# artifact; look at them and copy the good ones to docs/screenshots/ by hand.
# macOS minutes count tenfold for private repositories, so it builds only once.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  screenshots:
    name: Screenshots
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Collect third-party licenses
        run: pnpm licenses:generate

      # Only the .app: the shots install it to /Applications themselves, as a
      # player would from the DMG.
      - name: Build
        run: pnpm tauri build --bundles app

      # Ends well before the job does, so the shots taken so far still upload.
      - name: Take the screenshots
        timeout-minutes: 15
        run: |
          bash scripts/macos-screenshots.sh \
            src-tauri/target/release/bundle/macos/BloogBase.app \
            "$RUNNER_TEMP/shots" en de

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
